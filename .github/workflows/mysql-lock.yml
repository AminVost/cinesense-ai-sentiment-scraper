name: Update MySQL dependency lock
on:
  push:
    branches: [feat/shared-mysql-cache-auth]
    paths: [.github/workflows/mysql-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Resolve lockfile with official npm registry
        working-directory: movie-scraper
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add movie-scraper/package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "build: resolve MySQL driver dependency lock"
            git push origin HEAD:feat/shared-mysql-cache-auth
          fi
