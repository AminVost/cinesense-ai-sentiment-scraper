name: Refresh scraper lockfile once
on:
  push:
    branches: [feat/free-multi-source-reviews]
    paths:
      - .github/workflows/refresh-scraper-lock.yml
      - movie-scraper/package.json
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/free-multi-source-reviews
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh lockfile from official npm
        working-directory: movie-scraper
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Commit changed lockfile
        run: |
          if ! git diff --quiet -- movie-scraper/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add movie-scraper/package-lock.json
            git commit -m "build: lock serverless Playwright browser dependencies"
            git push origin HEAD:feat/free-multi-source-reviews
          fi
