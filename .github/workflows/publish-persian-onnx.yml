name: Publish free Persian ONNX model assets
on:
  push:
    branches: [feat/free-multi-source-reviews]
    paths: [.github/workflows/publish-persian-onnx.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: persian-sentiment-onnx
          run-id: 37942583075
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./model-assets
      - name: Verify exported model files
        run: |
          find model-assets -maxdepth 4 -type f -printf '%p %s bytes\n'
          test -s model-assets/onnx/model_quantized.onnx
          test -s model-assets/config.json
          test -s model-assets/tokenizer.json
      - name: Publish public, reusable ONNX model asset release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="persian-sentiment-onnx-v1"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "CineSense Persian Sentiment ONNX v1" --notes "Browser-ready INT8 ONNX export of HooshvareLab/bert-fa-base-uncased-sentiment-deepsentipers-binary (Apache 2.0). Full attribution: https://huggingface.co/HooshvareLab/bert-fa-base-uncased-sentiment-deepsentipers-binary. Binary model artifacts are large; users should cache them."
          gh release upload "$TAG" model-assets/onnx/model_quantized.onnx model-assets/config.json model-assets/tokenizer.json model-assets/tokenizer_config.json model-assets/special_tokens_map.json model-assets/vocab.txt --clobber
