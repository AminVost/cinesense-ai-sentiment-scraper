name: CineSense checks
on:
  push:
    branches: [main, "feat/free-multi-source-reviews"]
  pull_request:
    branches: [main]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: express-scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - run: node --check scraper.js
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile bertModel/fastApi.py
