name: Publish Persian ONNX to Hugging Face
on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: 'Optional public Hugging Face model namespace/name'
        required: false
        type: string
  push:
    branches: [main]
    paths: [.github/workflows/publish-persian-to-hf.yml]
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: persian-sentiment-onnx
          run-id: 37942583075
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: model-assets
      - name: Publish quantized Persian model to owner's free public repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REQUESTED_MODEL_ID: ${{ inputs.repo_id }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::GitHub Actions secret HF_TOKEN was not found."
            exit 1
          fi
          python -m pip install 'huggingface_hub>=0.25,<2'
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ["HF_TOKEN"])
          owner=api.whoami()["name"]
          model_id=os.environ.get("REQUESTED_MODEL_ID","").strip() or f"{owner}/cinesense-persian-sentiment-onnx"
          if "/" not in model_id:
              raise RuntimeError("Model repository must use namespace/name")
          config_path="model-assets/config.json"
          import json
          config=json.load(open(config_path,encoding="utf8"))
          assert config.get("id2label",{}).get("0","").lower()=="negative"
          assert config.get("id2label",{}).get("1","").lower()=="positive"
          assert os.path.getsize("model-assets/onnx/model_quantized.onnx")>100_000_000
          api.create_repo(repo_id=model_id,repo_type="model",private=False,exist_ok=True)
          api.upload_folder(repo_id=model_id,folder_path="model-assets",repo_type="model",
              commit_message="Publish open-source quantized Persian sentiment model")
          print("PUBLIC_MODEL_ID="+model_id)
          print("PUBLISHED_MODEL_URL=https://huggingface.co/"+model_id)
          PY
