name: DigiMoviez protected endpoint smoke
on:
  push:
    branches: [feat/free-multi-source-reviews]
    paths: [.github/workflows/smoke-digimoviez.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check unauthenticated scraping is blocked
        run: |
          node --input-type=module <<'NODE'
          const response=await fetch("https://cinesense.aminvost.ir/api/fetch-comments",{
            method:"POST",headers:{"content-type":"application/json"},
            body:JSON.stringify({url:"https://digimoviez.com/the-invite-2026/",maxComments:3}),
            signal:AbortSignal.timeout(20000)
          });
          if(response.status!==401){
            throw Error("Expensive browser endpoint must be protected; received HTTP "+response.status);
          }
          console.log("PASS: private scraper rejects unauthenticated calls without launching Chromium.");
          NODE
