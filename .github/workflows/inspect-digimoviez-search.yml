name: Inspect DigiMoviez search DOM
on:
  push:
    branches: [feat/auto-discover-movie-sources]
    paths: [.github/workflows/inspect-digimoviez-search.yml]
permissions: { contents: read }
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
        working-directory: movie-scraper
      - name: Inspect search HTML and links
        working-directory: movie-scraper
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
          const context=await browser.newContext({serviceWorkers:'block'});
          await context.route('**/*',route=>{
            const url=new URL(route.request().url());
            const ok=url.hostname==='digimoviez.com'||url.hostname==='www.digimoviez.com';
            return ok&&!['image','media','font','stylesheet'].includes(route.request().resourceType())?route.continue():route.abort();
          });
          try {
            for(const query of ['Interstellar','The Invite']){
              const page=await context.newPage();
              const url='https://digimoviez.com/?s='+encodeURIComponent(query);
              try{
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:26000});
                console.log('SEARCH',query,'HTTP',response.status(),'LOCATION',page.url());
                const data=await page.evaluate(()=>{
                  const title=document.title;
                  const links=[...document.querySelectorAll('a[href]')]
                    .filter(a=>(a.href||'').startsWith('https://digimoviez.com/') ||(a.href||'').startsWith('https://www.digimoviez.com/'))
                    .slice(0,150).map(a=>({text:(a.textContent||a.getAttribute('title')||'').trim().slice(0,100),href:a.href,
                    parent:a.parentElement?.className||'',grand:a.parentElement?.parentElement?.className||''}));
                  return {title,links:links.filter(x=>x.href&&!/\/page\/|\/category\/|\/tag\/|\/wp-content\//.test(x.href)).slice(0,55),
                    resultCount:document.querySelectorAll('article,.post,.post-item,.search-result,.item').length};
                });
                console.log('SEARCH_RESULT',query,JSON.stringify(data).slice(0,10500));
              } catch(e){console.log('SEARCH_ERROR',query,String(e).slice(0,250));}
              await page.close();
            }
          }finally{await browser.close();}
          NODE
